schema_version: 1

context:
  name: wimsey
  version: "1.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/wimsey-${{ version }}.tar.gz
  sha256: 7f83faa33d04846a660be7fbd6337ba66cad153a69f0bcac603080e2d976c634

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.2,<4
    - pip
  run:
    - python >=${{ python_min }}
    - narwhals >=2.0.0
    - fsspec >=2024.10.0

tests:
  - python:
      imports:
        - wimsey
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A lightweight data contracts framework
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/benrutter/wimsey
  documentation: https://benrutter.github.io/wimsey/

extra:
  recipe-maintainers:
    - thewchan
